apiVersion: apps/v1
kind: Deployment
metadata:
  name: video-streaming
  labels:
    app: video-streaming
spec:
  replicas: 1
  selector:
    matchLabels:
      app: video-streaming
  template:
    metadata:
      labels:
        app: video-streaming
    spec:
      containers:
        - name: video-streaming
          image: python:3.13-slim
          ports:
            - name: http
              containerPort: 8000